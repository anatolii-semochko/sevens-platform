server {
    listen 80;
    server_name sevenstime.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sevenstime.local;

    charset utf-8;
    root /app/public;
    index index.php;
    server_tokens off;

    ssl_certificate     /app/sevenstime.local.crt;
    ssl_certificate_key /app/sevenstime.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 ipv6=off;

    location /health {
        add_header Content-Type text/plain;
        return 200 'alive';
    }

    # Proxy Node.js server requests
    location /node/ {
        proxy_pass http://platform-node-server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Proxy WebSocket connections for Socket.IO
    # Client connects to wss://sevenstime.local/ws/socket.io/
    # Nginx strips /ws/ and proxies to http://platform-node-server:3000/socket.io/
    location /ws/ {
        proxy_pass http://platform-node-server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy LocalStack S3 requests (use ^~ to override regex locations like static files)
    location ^~ /s3/ {
        # Remove /s3 prefix and proxy to LocalStack
        # Use rewrite with 'break' flag to preserve URL encoding
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://localstack:4566;

        # Don't override Host header - let it pass through
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large file uploads (up to 5GB for material archives)
        client_max_body_size 5G;
        proxy_request_buffering off;

        # Increase timeouts for large uploads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        # Disable buffering for streaming
        proxy_buffering off;

        # Add debug header
        add_header X-Proxy-Pass "LocalStack-S3" always;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,HEAD,OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,X-Features' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,HEAD,OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,X-Features' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location /storage/ {
        alias /app/public/storage/;
        try_files $uri =404;
    }

    # Allow larger payloads for specific upload endpoints (if using direct upload, not presigned URLs)
    location ~ ^/(en|uk)/api/material/[^/]+/upload-archive$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Allow large direct uploads (alternative to presigned URLs)
        client_max_body_size 5G;
        client_body_timeout 300s;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Standard limit for API requests (presigned URL flow uses /s3/ which has 5G limit)
        client_max_body_size 10M;
    }
}
