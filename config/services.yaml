# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    public_folder: '%env(PUBLIC_FOLDER)%'
    path_translations: '%env(PATH_TRANSLATIONS)%'
    path_help_translations: '%env(PATH_HELP_TRANSLATIONS)%'
    path_language_flags: '%env(PATH_LANGUAGE_FLAGS)%'
    path_category_logos: '%env(PATH_CATEGORY_LOGOS)%'
    path_materials: '%env(PATH_MATERIALS)%'
    allowed_publishing_time_without_signature_minutes: '%env(int:ALLOWED_PUBLISHING_TIME_WITHOUT_SIGNATURE_MINUTES)%'

    # AWS Configuration
    aws.endpoint: '%env(AWS_ENDPOINT)%'
    aws.region: '%env(AWS_REGION)%'
    aws.access_key_id: '%env(AWS_ACCESS_KEY_ID)%'
    aws.secret_access_key: '%env(AWS_SECRET_ACCESS_KEY)%'
    aws.use_path_style_endpoint: '%env(bool:AWS_USE_PATH_STYLE_ENDPOINT)%'

    # S3 Configuration
    aws.s3.materials_bucket: '%env(AWS_S3_MATERIALS_BUCKET)%'
    aws.s3.presigned_expiration: '%env(int:AWS_S3_PRESIGNED_EXPIRATION)%'
    aws.s3.public_endpoint: '%env(AWS_S3_PUBLIC_ENDPOINT)%'

    # Lambda Configuration
    aws.lambda.material_validator_function: '%env(AWS_LAMBDA_MATERIAL_VALIDATOR_FUNCTION)%'
    aws.lambda.timeout: '%env(int:AWS_LAMBDA_TIMEOUT)%'

    # CDN Configuration
    cdn.enabled: '%env(bool:CDN_ENABLED)%'
    cdn.base_url: '%env(CDN_BASE_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\LocaleStorage:
        public: true

    App\EventListener\PageInitializerListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: -100 }

    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Service\Help\HelpService:
      arguments:
        $path:
          publicFolder: '%public_folder%'
          helpTranslations: '%path_help_translations%'

    App\Twig\AppGlobalVariables:
      arguments:
        $path:
          publicFolder: '%public_folder%'
          translations: '%path_translations%'
          helpTranslations: '%path_help_translations%'
          languageFlags: '%path_language_flags%'
          categoryLogos: '%path_category_logos%'
          materials: '%path_materials%'

    App\Service\NodeServer\NodeServerApiClient:
      arguments:
        $nodeServerBaseUrl: '%env(NODE_SERVER_BASE_URL)%'

    App\Service\Blockchain\TokenService:
      arguments:
        $allowedPublishingTimeWithoutSignatureMinutes: '%allowed_publishing_time_without_signature_minutes%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
