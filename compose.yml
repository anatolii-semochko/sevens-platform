services:
  web:
    build:
      context: .
      dockerfile: docker/development/nginx/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ../sevenstime-storage/files:/app/public/files
      - ../sevenstime-storage/images:/app/assets/images
    networks:
      - default
      - blockchain.dev
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: .
      dockerfile: docker/development/php-fpm/Dockerfile
      args:
        - HOST_UID=1000
        - HOST_GID=1000
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - ../sevenstime-storage/files:/app/public/files
      - ../sevenstime-storage/images:/app/assets/images
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  php-cli:
    build:
      context: .
      dockerfile: docker/development/php-cli/Dockerfile
    volumes:
      - .:/app
      - ../sevenstime-storage/files:/app/public/files
      - ../sevenstime-storage/images:/app/assets/images
    networks:
      - default

  web-node:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
      - ../sevenstime-storage/files:/app/public/files
      - ../sevenstime-storage/images:/app/assets/images
    command: sh -c "yarn install && yarn encore dev --watch"
    tty: true
    networks:
      - default

  mysql:
    image: mysql:9.3
    environment:
      MYSQL_USER: app
      MYSQL_DATABASE: sevens
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "3307:3306"
    volumes:
      - ./../.data/sevens:/var/lib/mysql
    secrets:
      - db_password
    networks:
      - default

secrets:
  db_password:
    file: ./docker/development/secrets/db_password
  mailer_password:
    file: ./docker/development/secrets/mailer_password
  sentry_dsn:
    file: ./docker/development/secrets/sentry_dsn
  jwt_encryption_key:
    file: ./docker/development/secrets/jwt_encryption_key
  jwt_public_key:
    file: ./docker/development/secrets/jwt_public_key
  jwt_private_key:
    file: ./docker/development/secrets/jwt_private_key
  backup_aws_secret_access_key:
    file: ./docker/development/secrets/backup_aws_secret_access_key

volumes:
  mysql-backup:
  backup-storage:

networks:
  blockchain.dev:
    external: true
    name: sevens.dev
